<!DOCTYPE html>
<html lang="es-co">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="styles/styleform.css">
  <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <a href="login.html" class="back-button">
    <i class="fas fa-arrow-left"></i> Volver
  </a>

  <section>
    <div class="container">
      <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4 mt-5">
          <h3 class="card-title text-center">Registro de Usuario</h3>
          <div class="card-text">
            <form id="registroForm">
              <!-- Datos personales -->
              <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su nombre"
                  required>
                <small class="error-message" id="nombreError"></small>
              </div>

              <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" name="apellidos"
                  placeholder="Ingrese sus apellidos" required>
                <small class="error-message" id="apellidosError"></small>
              </div>

              <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
                <small class="error-message" id="fechaError"></small>
              </div>

              <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" class="form-control" id="edad" name="edad" readonly>
              </div>

              <!-- Datos de cuenta -->
              <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email"
                  placeholder="Ingrese su correo electrónico" required>
                <small class="error-message" id="emailError"></small>
              </div>

              <div class="form-group">
                <label for="usuario">Usuario (generado automáticamente)</label>
                <input type="text" class="form-control" id="usuario" name="usuario" readonly>
              </div>

              <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password"
                  placeholder="Mínimo 8 caracteres" required>
                <small class="error-message" id="passwordError"></small>
                <div class="password-requirements">
                  <small>Debe contener al menos: 8 caracteres, 2 números, 1 mayúscula y 1 carácter especial</small>
                </div>
              </div>

              <div class="form-group">
                <label for="confirmPassword">Repetir Contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                  placeholder="Repita su contraseña" required>
                <small class="error-message" id="confirmError"></small>
              </div>

              <!-- Selección de avatar -->
              <div class="form-group">
                <label>Seleccione su avatar:</label>
                <div class="avatar-options">
                  <div class="avatar-option">
                    <input type="radio" id="avatar1" name="avatar" value="avatar1.png" required>
                    <label for="avatar1">
                      <img src="img/avatars/avatar1.png" alt="Avatar 1">
                    </label>
                  </div>
                  <div class="avatar-option">
                    <input type="radio" id="avatar2" name="avatar" value="avatar2.png">
                    <label for="avatar2">
                      <img src="img/avatars/avatar2.png" alt="Avatar 2">
                    </label>
                  </div>
                  <div class="avatar-option">
                    <input type="radio" id="avatar3" name="avatar" value="avatar3.png">
                    <label for="avatar3">
                      <img src="img/avatars/avatar3.png" alt="Avatar 3">
                    </label>
                  </div>
                  <div class="avatar-option">
                    <input type="radio" id="avatar4" name="avatar" value="avatar4.png">
                    <label for="avatar4">
                      <img src="img/avatars/avatar4.png" alt="Avatar 4">
                    </label>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-primary btn-block" id="btnRegistrar" disabled>Registrarse</button>
              <br> <a href="registro.html" style="float:right;font-size:12px;">limpiar</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/registro.js"></script>>

</body>

</html>
