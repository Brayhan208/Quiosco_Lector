<body>
  <div class="pomodoro-container">
    <header class="pomodoro-header">
      <h1><i class="fas fa-clock"></i> Método Pomodoro</h1>
    </header>

    <main class="pomodoro-main">
      <section class="pomodoro-timer">
        <div class="timer-display">
          <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <div class="timer-controls">
          <button id="startBtn" class="pomodoro-btn pomodoro-btn-primary">
            <i class="fas fa-play"></i> Iniciar
          </button>
          <button id="pauseBtn" class="pomodoro-btn pomodoro-btn-secondary" disabled>
            <i class="fas fa-pause"></i> Pausar
          </button>
          <button id="resetBtn" class="pomodoro-btn pomodoro-btn-tertiary">
            <i class="fas fa-redo"></i> Reiniciar
          </button>
        </div>
        <div class="timer-modes">
          <button class="mode-btn active" data-minutes="25">Pomodoro</button>
          <button class="mode-btn" data-minutes="5">Descanso Corto</button>
          <button class="mode-btn" data-minutes="15">Descanso Largo</button>
        </div>
        <div class="pomodoro-counter">
          <span id="completedPomodoros">0</span> Pomodoros completados
        </div>
      </section>

      <section class="pomodoro-calendar">
        <div class="calendar-header">
          <h2><i class="fas fa-calendar-alt"></i> Calendario de Eventos</h2>
          <button id="addEventBtn" class="pomodoro-btn pomodoro-btn-primary">
            <i class="fas fa-plus"></i> Nuevo Evento
          </button>
        </div>
        <div class="calendar-display">
          <div class="calendar-month">
            <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
            <h3 id="currentMonth">Mes Actual</h3>
            <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
          </div>
          <div class="calendar-grid" id="calendarGrid">
            <!-- Días del mes se generarán con JavaScript -->
          </div>
        </div>
        <div class="events-list" id="eventsList">
          <h3>Eventos de hoy</h3>
          <!-- Eventos se generarán con JavaScript -->
        </div>
      </section>
    </main>

    <!-- Modal para agregar eventos -->
    <div class="pomodoro-modal" id="eventModal" style="display: none;">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Agregar Nuevo Evento</h2>
        <form id="eventForm">
          <div class="form-group">
            <label for="eventTitle">Título del Evento</label>
            <input type="text" id="eventTitle" required>
          </div>
          <div class="form-group">
            <label for="eventDate">Fecha</label>
            <input type="date" id="eventDate" required>
          </div>
          <div class="form-group">
            <label for="eventTime">Hora</label>
            <input type="time" id="eventTime" required>
          </div>
          <div class="form-group">
            <label for="eventDescription">Descripción</label>
            <textarea id="eventDescription" rows="3"></textarea>
          </div>
          <button type="submit" class="pomodoro-btn pomodoro-btn-primary">
            <i class="fas fa-save"></i> Guardar Evento
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/pomodoro.js"></script>
</body>
