<!DOCTYPE html>
<html lang="es-co">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="styles/styleform.css">
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Volver
    </a>

    <section>
        <div class="container">
            <div class="row">
                <div class="class col-md-4"></div>
                <div class="class col-md-4 mt-5">
                    <br>
                    <h3 class="card-title text-center">Iniciar Sesión</h3>
                    <div class="card-text">
                        <br><br>

                        <form id="loginForm">
                            <div class="form-group">
                                <label for="user">Usuario</label>
                                <input type="text" class="form-control form-control-sm" name="user"
                                    placeholder="Ingrese su usuario">
                            </div>

                            <div class="form-group">
                                <label for="clave">Contraseña</label>
                                <input type="password" class="form-control form-control-sm" name="clave" id="clave"
                                    placeholder="Ingrese su contraseña">
                                <br>
                                <a href="editarperfil.html" style="float:right;font-size:12px;">¿Olvidaste tu contraseña?</a>
                                <br>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block" name="login">Iniciar sesión</button>

                            <div class="sign-up">
                                <a href="registro.html" class="mt-5">¿Todavía no tienes una cuenta? Regístrate</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/login.js"> </script>
</body>

</html>
