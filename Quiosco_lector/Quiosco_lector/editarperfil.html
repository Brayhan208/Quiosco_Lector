<!DOCTYPE html>
<html lang="es-co">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil</title>
  <link rel="stylesheet" href="styles/styleform.css">
  <link rel="stylesheet" href="styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="header-container">
      <div class="logo-title">
        <a href="index.html" target="_blank"></a>
        <img src="img/logo_quiosco.jpg" alt="Logo Quiosco" class="logo-circular">
        <h1 class="titulo-quiosco">Quiosco Lector</h1>
      </div>

      <form class="search-form" role="search">
        <input type="search" placeholder="Buscar libros..." aria-label="Buscar libros">
      </form>

      <div class="user-actions">
        <button id="btn-login" class="btn-login">Iniciar Sesión</button>

        <!-- Main dropdown menu -->
        <div class="dropdown-menu-container" id="main-dropdown">
          <button class="dropdown-menu-button">
            Menú <i class="fas fa-chevron-down"></i>
          </button>
          <div class="dropdown-menu-content">
            <a href="planes.html">Ver Planes</a>
            <a href="leer.html">Libros</a>
            <a href="metodo.html">Método Pomodoro</a>
            <a href="subir.html">Subir Archivos</a>
          </div>
        </div>
      </div>

      <!-- Mobile menu toggle -->
      <button class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    </div>
  </header>

  <script src="js/editarperfil.js"> </script>

  <section class="profile-section">
    <div class="container">
      <h2 class="section-title">Mi Perfil</h2>


      <div class="profile-header">
        <div class="avatar-container">
          <img id="userAvatar" src="img/avatars/avatar1.png" alt="Avatar" class="profile-avatar">
          <button id="changeAvatar" class="btn-edit">Cambiar</button>
        </div>
        <h3 id="userName"></h3>
        <p id="userEmail"></p>
      </div>
      <div class="profile-card">
        <form id="profileForm" class="profile-form">
          <div class="form-group row">
            <div class="col-md-6">
              <label for="editNombre">Nombre</label>
              <input type="text" id="editNombre" class="form-control">
            </div>
            <div class="col-md-6">
              <label for="editApellidos">Apellidos</label>
              <input type="text" id="editApellidos" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label for="editEmail">Correo Electrónico</label>
            <input type="email" id="editEmail" class="form-control">
          </div>

          <div class="form-group">
            <label for="editFechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" id="editFechaNacimiento" class="form-control">
          </div>

          <div class="form-group">
            <label for="currentPassword">Contraseña Actual</label>
            <input type="password" id="currentPassword" class="form-control" placeholder="Ingrese su contraseña actual">
          </div>

          <div class="form-group">
            <label for="newPassword">Nueva Contraseña</label>
            <input type="password" id="newPassword" class="form-control" placeholder="Ingrese nueva contraseña">
          </div>

          <div class="form-group">
            <label for="confirmNewPassword">Confirmar Nueva Contraseña</label>
            <input type="password" id="confirmNewPassword" class="form-control" placeholder="Confirme nueva contraseña">
          </div>

          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
          <div class="sign-up">
            <a href="login.html" class="mt-5">Cerrar Sesión</a>
          </div>
        </form>

  </section>
  <footer>
    <div class="equipo">
      <div class="instagram">
        <a href="https://www.instagram.com/quioscolector?igsh=cWJxZHMweTM3emQw" target="_blank">
          <img src="img/instagram.png" alt="Instagram" class="instagram-logo">
        </a>
      </div>

      <div class="team-content">
        <h2>Equipo de trabajo</h2>
        <div class="miembros-container">
          <div class="miembro">
            <a href="https://www.instagram.com/tmq_juana?igsh=MWVndml1ZWd1emZlYw==" target="_blank">
              <img src="img/foto_juana.jpg" alt="Juana Pabon">
            </a>
            <p><strong>Juana Pabon</strong><br>Desarrolladora</p>
          </div>
          <div class="miembro">
            <a href="https://www.instagram.com/brayhan208/" target="_blank">
              <img src="img/foto_brayhan.jpg" alt="Brayhan Gonzalez">
            </a>
            <p><strong>Brayhan Gonzalez</strong><br>Desarrollador</p>
          </div>
        </div>
      </div>
    </div>
  </footer>

</body>

</html>
